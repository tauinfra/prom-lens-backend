server:
  port: 8080

app:
  jwt_secret: "JWT_SECRET_PASSWORD"
  encryption_key: "202b49a8b937101f9380bd19d8f3498fd5ac5c91b9aa50230f9948ed61b42088"

auth:
  access_token_expires: 1h    # 1 小时
  refresh_token_expires: 24h   # 1 天
  issuer: "valyria-server"
  audience: "valyria-client"
  login_max_retries: 5
  login_lock_window: 15m
  whitelist:
    - /api/v1/authn/login
    - /api/v1/authn/refresh-token
    - /health
    - /metrics

database:
  host: "127.0.0.1"
  username: "root"
  password: "asd123.com"
  dbname: "valyria"
  port: 3306
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: "1h"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

logging:
  log_dir: "logs"
  info_log_name: "info.log"
  error_log_name: "error.log"
  enable_console: true

kubernetes:
  timeout: 30
  qps: 50     # per-client QPS
  burst: 100  # per-client burst
  argocd:
    server: argocd-server.argocd.svc
    insecure: true
  tekton:
    namespace: default # 实际环境建议使用指定命名空间: tekton-ci

prometheus:
  target:
    namespace: monitoring-test
    configmap: prometheus-targets
  rule:
    namespace: monitoring-test
    configmap: prometheus-rules

dragon:
  kustomize:
    repo_url: https://gitlab.com/valyrias/kubernetes.git
    branch: main

# K8s 权限同步 Worker：后台按 next_retry_at 重试 pending_sync/failed，达 max_retry 置为 dead
# 退避公式：下次重试间隔 = base_delay * 2^已重试次数，上限 max_delay；worker_count 预留未用
permission_worker:
  scan_interval: 2m   # 扫描间隔
  batch_size: 100      # 每批拉取条数，上限 1000
  worker_count: 5      # 预留，当前未使用
  max_retry: 5         # 最大重试次数
  base_delay: 30s      # 退避基准
  max_delay: 15m       # 退避上限