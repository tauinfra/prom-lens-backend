apiVersion: apps/v1
kind: Deployment
metadata:
  name: prom-lens-backend
  namespace: prom-lens
  labels:
    app.kubernetes.io/name: prom-lens-backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: prom-lens-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prom-lens-backend
    spec:
      serviceAccountName: prom-lens-backend
      containers:
        - name: prom-lens-backend
          image: prom-lens-backend:latest
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /app/config/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: PROM_LENS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: prom-lens-secret
                  key: database-password
            - name: PROM_LENS_APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: prom-lens-secret
                  key: jwt-secret
            - name: PROM_LENS_BASE_URL
              value: http://prom-lens-backend.prom-lens.svc.cluster.local:8080
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: logs
              mountPath: /app/logs
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prom-lens-config
        - name: logs
          emptyDir: {}
