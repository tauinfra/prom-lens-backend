apiVersion: v1
kind: ConfigMap
metadata:
  name: prom-lens-config
  namespace: prom-lens
  labels:
    app.kubernetes.io/name: prom-lens-backend
data:
  config.yaml: |
    server:
      port: 8080

    auth:
      access_token_expires: 1h
      refresh_token_expires: 24h
      issuer: prom-lens-server
      audience: prom-lens-client
      whitelist:
        - /api/v1/authn/login
        - /api/v1/authn/refresh-token
        - /api/v1/alerting/webhook/
        - /health
        - /readyz
        - /metrics

    database:
      host: mysql.prom-lens.svc.cluster.local
      username: prom_lens
      dbname: prom_lens
      port: 3306
      max_idle_conns: 10
      max_open_conns: 50
      conn_max_lifetime: 1h

    logging:
      log_dir: logs
      info_log_name: info.log
      error_log_name: error.log
      enable_console: true

    prometheus:
      target:
        namespace: monitoring
        configmap: prometheus-targets
      rule:
        namespace: thanos
        configmap: thanos-ruler-config

    # 集群内 Service 地址，供 AlertManager 回调
    base_url: http://prom-lens-backend.prom-lens.svc.cluster.local:8080

    alerting:
      lark_timeout: 10s
      alertmanager:
        namespace: monitoring
        configmap: alertmanager-config
        config_key: alertmanager.yml
        default_receiver: ""
